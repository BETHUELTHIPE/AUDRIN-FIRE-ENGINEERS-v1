<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="100%" height="100%" fill="none">
  <!-- AUDRIN FIRE ENGINEERS OFFICIAL LOGO -->
  <g id="audrin-logo-emblem" transform="translate(10, 0)">
    <!-- Red Alarm Signal Waves (Left) -->
    <path 
      d="M 52 58 C 30 78, 30 122, 52 142" 
      stroke="#E5252A" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      fill="none" 
    />
    <path 
      d="M 32 40 C 0 74, 0 126, 32 160" 
      stroke="#E5252A" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      fill="none" 
    />

    <!-- Red Alarm Signal Waves (Right) -->
    <path 
      d="M 148 58 C 170 78, 170 122, 148 142" 
      stroke="#E5252A" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      fill="none" 
    />
    <path 
      d="M 168 40 C 200 74, 200 126, 168 160" 
      stroke="#E5252A" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      fill="none" 
    />

    <!-- Main Navy Letter 'A' Outer Frame -->
    <path 
      d="M 86 28 L 114 28 L 174 168 L 138 168 L 123 132 L 77 132 L 62 168 L 26 168 Z M 100 56 L 85 96 L 115 96 Z" 
      fill="#07193F" 
      fill-rule="evenodd"
    />

    <!-- Smoke / Fire Detector Head Integrated Into Crossbar -->
    <!-- Detector Outer Housing Base -->
    <path 
      d="M 64 122 C 64 102, 136 102, 136 122 L 128 152 C 128 164, 72 164, 72 152 Z" 
      fill="#FFFFFF" 
      stroke="#07193F" 
      stroke-width="7" 
      stroke-linejoin="round"
    />
    
    <!-- Detector Upper Ridge / Collar -->
    <path 
      d="M 67 122 C 67 110, 133 110, 133 122" 
      stroke="#07193F" 
      stroke-width="6" 
      fill="none" 
    />

    <!-- Detector Sensor Chamber Grill / Slits -->
    <line x1="100" y1="126" x2="100" y2="144" stroke="#07193F" stroke-width="4.5" stroke-linecap="round" />
    <line x1="91" y1="127" x2="91" y2="143" stroke="#07193F" stroke-width="4.5" stroke-linecap="round" />
    <line x1="109" y1="127" x2="109" y2="143" stroke="#07193F" stroke-width="4.5" stroke-linecap="round" />
    <line x1="82" y1="129" x2="83" y2="141" stroke="#07193F" stroke-width="4.5" stroke-linecap="round" />
    <line x1="118" y1="129" x2="117" y2="141" stroke="#07193F" stroke-width="4.5" stroke-linecap="round" />

    <!-- Detector Central Optical Sensor / Red LED Indicator -->
    <circle cx="100" cy="151" r="5.5" fill="#E5252A" />
  </g>

  <!-- Wordmark Section -->
  <g id="audrin-logo-text">
    <!-- Top Bold AUDRIN in Deep Brand Navy -->
    <text 
      x="226" 
      y="120" 
      font-family="system-ui, -apple-system, 'Montserrat', 'Inter', 'Arial Black', sans-serif" 
      font-size="96" 
      font-weight="900" 
      letter-spacing="-1" 
      fill="#07193F"
    >AUDRIN</text>

    <!-- Bottom FIRE ENGINEERS in Vibrant Alarm Red with Precise Proportional Tracking -->
    <text 
      x="228" 
      y="160" 
      font-family="system-ui, -apple-system, 'Montserrat', 'Inter', sans-serif" 
      font-size="27" 
      font-weight="800" 
      letter-spacing="9.8px" 
      fill="#E5252A"
    >FIRE ENGINEERS</text>
  </g>
</svg>
